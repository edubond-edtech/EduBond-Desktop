# Builds the Windows installer (EduKit-Setup.exe) and the macOS app on GitHub's machines.
# Run it from the repository's "Actions" tab ("Run workflow"), or push a tag like v0.1.0.
# Download the results from the run's "Artifacts" section.
# Pushing a tag like v0.2.0 also publishes a GitHub Release with both files, so
# schools can download from a fixed link: https://github.com/<owner>/<repo>/releases/latest
name: build-edukit

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: desktop
        run: python -m pip install -r requirements-dev.txt pyinstaller
      - name: Run tests
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build EduKit.exe
        working-directory: desktop
        run: pyinstaller --noconfirm --clean packaging/edukit.spec
      - name: Build installer
        working-directory: desktop
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = "0.1.0"
          if ($env:GITHUB_REF_TYPE -eq "tag") { $ver = $env:GITHUB_REF_NAME.TrimStart("v") }
          Write-Host "Inno Setup compiler: $iscc  version: $ver"
          & $iscc "/DAppVersion=$ver" packaging/edukit.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem dist/installer -Filter "EduKit-Setup-*.exe" -ErrorAction SilentlyContinue
          if (-not $setup) { Write-Error "EduKit-Setup.exe was not produced"; Get-ChildItem -Recurse dist -Filter *.exe | Select-Object FullName; exit 1 }
          Write-Host "Installer: $($setup.FullName)"
          Compress-Archive -Path dist/EduKit/* -DestinationPath dist/EduKit-portable-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EduKit-Windows
          path: |
            desktop/dist/installer/EduKit-Setup-*.exe
            desktop/dist/EduKit-portable-windows.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build EduKit.app
        working-directory: desktop
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean packaging/edukit.spec
          ditto -c -k --keepParent dist/EduKit.app dist/EduKit-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EduKit-macOS
          path: desktop/dist/EduKit-macOS.zip

  release:
    # Only for version tags (v0.2.0 …): publish both builds on the repository's Releases page.
    # The Windows installer is required; the macOS build is added when it succeeds.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: List files
        run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          name: EduKit ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
          body: |
            **Windows:** download `EduKit-Setup-*.exe` and run it. If Windows shows «Windows protected your PC», click *More info* → *Run anyway*.
            **ويندوز:** حمّل ملف `EduKit-Setup-*.exe` وشغّله. إن ظهر تحذير «Windows protected your PC» اضغط *More info* ثم *Run anyway*.
            **macOS:** download `EduKit-macOS.zip`, unzip it and move EduKit to Applications (first launch: right-click → Open).

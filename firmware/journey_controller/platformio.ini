; EduKit — Game 1 «رحلة إلى مكة»
; Board: "ESP32 Dev Module" (ESP32-WROOM-32 DevKit). One source, three board variants:
;
;   pio run -e touch_input -t upload   board 1: 4 touch answer pads (27/14/13/4)  -> INPUT_01, role "input"
;   pio run -e led_map     -t upload   board 2: LED route strip on GPIO 26         -> MAP_01,   role "map"
;   pio run -e led_map_c3  -t upload   board 2 on ESP32-C3: LED strip on GPIO 7     -> MAP_01,   role "map"
;   pio run -e esp32dev    -t upload   original single board: strip + buttons + touch -> JOURNEY_01
[platformio]
default_envs = touch_input, led_map_c3

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800   ; 921600 is unreliable with CH340 USB chips
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    adafruit/Adafruit NeoPixel@1.12.3
    h2zero/NimBLE-Arduino@1.4.2

[env:touch_input]
build_flags =
    -DEDUKIT_TOUCH_ONLY
    -DEDUKIT_DEVICE_ID=\"INPUT_01\"

[env:led_map]
build_flags =
    -DEDUKIT_LED_ONLY
    -DLED_PIN=26
    -DEDUKIT_DEVICE_ID=\"MAP_01\"

[env:esp32dev]
build_flags =
    -DEDUKIT_DEVICE_ID=\"JOURNEY_01\"


; board 2 on an ESP32-C3 with a CH340 USB chip (Serial = UART0): LED route strip on GPIO7
[env:led_map_c3]
board = esp32-c3-devkitm-1
build_flags =
    -DEDUKIT_LED_ONLY
    -DLED_PIN=7
    -DBUZZER_PIN=-1
    -DSTATUS_LED=-1
    -DEDUKIT_DEVICE_ID=\"MAP_01\"

; EduKit — word-card board (resistor-coded cards, 6 sockets, SEND button, BLE) — ESP32-WROOM-32 DevKit
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800   ; 921600 is unreliable with CH340 USB chips
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    h2zero/NimBLE-Arduino@1.4.2
build_flags =
    -DEDUKIT_DEVICE_ID=\"PUZZLE_01\"
